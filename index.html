<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujan Chapagain</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #fdf5e6; /* cream white */
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #fdf5e6; /* cream white */
      color: #333;
      padding: 30px 0;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 20px auto;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
    }

    .card img {
      max-width: 200px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .social-icons {
      margin-top: 15px;
    }

    .social-icons a {
      color: #333;
      margin: 0 10px;
      font-size: 1.5rem;
      transition: color 0.3s;
    }

    .social-icons a:hover {
      color: #0073e6;
    }

    footer {
      background-color: #fdf5e6; /* cream white */
      color: #333;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Sujan Chapagain</h1>
    <p>Welcome to my personal portfolio</p>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="card">
      <img src="img/aa.png" alt="Profile Picture">
      <h2>Sujan Chapagain</h2>
      <p>B.Sc. Agriculture | Researcher | Activist</p>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Sujan Chapagain. All rights reserved.</p>
  </footer>

</body>
</html>
