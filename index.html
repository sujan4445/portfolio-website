<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujan Chapagain</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #fdf5e6; /* cream white */
      color: #333; /* black text */
      line-height: 1.6;
    }

    /* Navigation Bar */
    nav {
      background-color: #fdf5e6; /* cream white background */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 8%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #000; /* black text */
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li {
      display: inline-block;
    }

    nav ul li a {
      text-decoration: none;
      color: #000; /* black text */
      font-weight: bold;
      font-size: 1rem;
      transition: color 0.3s, border-bottom 0.3s;
    }

    nav ul li a:hover {
      color: #0073e6;
      border-bottom: 2px solid #0073e6;
    }

    /* Header Section */
    header {
      background-color: #fdf5e6; /* cream white */
      color: #000; /* black text */
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      color: #333;
    }

    /* Container */
    .container {
      width: 90%;
      max-width: 1100px;
      margin: 20px auto;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
    }

    .card img {
      max-width: 200px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    /* Social Icons */
    .social-icons {
      margin-top: 15px;
    }

    .social-icons a {
      color: #333;
      margin: 0 10px;
      font-size: 1.5rem;
      transition: color 0.3s;
    }

    .social-icons a:hover {
      color: #0073e6;
    }

    /* Footer */
    footer {
      background-color: #fdf5e6; /* cream white */
      color: #000;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="#" class="logo">SC</a>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Publications</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Blogs</a></li>
      <li><a href="#">Organization</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>
    <h1>Sujan Chapagain</h1>
    <p>Welcome to my personal portfolio</p>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="card">
      <img src="img/aa.png" alt="Profile Picture">
      <h2>Sujan Chapagain</h2>
      <p>B.Sc. Agriculture | Researcher | Activist</p>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Sujan Chapagain. All rights reserved.</p>
  </footer>

</body>
</html>
