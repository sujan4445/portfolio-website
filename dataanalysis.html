<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Certificates Gallery — Two-per-row PDF viewer</title>
  <style>
    :root{--gap:18px;--card-bg:#ffffff;--accent:#0b74de;--shadow:0 6px 18px rgba(12,24,40,0.08)}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; background:#f6f8fb; color:#0b1020}
    .wrap{max-width:1100px;margin:36px auto;padding:20px}
    h1{font-size:20px;margin:0 0 18px}

    /* grid: two columns on ≥700px, one column on small screens */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
    @media (max-width:700px){.grid{grid-template-columns:1fr}}

    .card{background:var(--card-bg);border-radius:12px;padding:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
    .thumb{width:48%;min-height:140px;border-radius:8px;overflow:hidden;background:#111}
    .thumb object, .thumb iframe{width:100%;height:100%;border:0;display:block}

    .meta{flex:1;display:flex;flex-direction:column;gap:10px}
    .title{font-weight:600;font-size:15px}
    .desc{font-size:13px;color:#445;line-height:1.3}

    .actions{display:flex;gap:8px;margin-top:auto}
    .btn{background:transparent;border:1px solid #d3dbe8;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
    .btn.primary{background:var(--accent);color:white;border-color:transparent}

    /* modal viewer */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,0.55);z-index:60}
    .modal.open{display:flex}
    .modal-inner{width:92%;max-width:1000px;height:86vh;background:white;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
    .modal-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #eef2f8}
    .modal-toolbar .title{font-size:14px}
    .modal-body{flex:1}
    .modal-body iframe{width:100%;height:100%;border:0}

    .small{font-size:12px;color:#6b7280}
    .note{margin-top:14px;font-size:13px;color:#374151}

    /* accessibility focus */
    .btn:focus{outline:3px solid rgba(11,116,222,0.18)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Certificates</h1>
    <p class="small">Click "Open" to view the full PDF in a modal. Put the PDF files next to this HTML file (same folder) or update the <code>data-pdf</code> paths below.</p>

    <style>
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
    .thumb{width:100%;height:420px;border-radius:10px;overflow:hidden;background:#111}
    .thumb iframe{width:100%;height:100%;border:0}
</style>

<div class="grid">
  <article class="card" data-pdf="img/Data analysis with R Programming.pdf">
    <div class="thumb">
      <iframe src="img/Data analysis with R Programming.pdf#view=FitH"></iframe>
    </div>
  </article>

  <article class="card" data-pdf="img/Introduction to Python.pdf">
    <div class="thumb">
      <iframe src="img/Introduction to Python.pdf#view=FitH"></iframe>
    </div>
  </article>

  <article class="card" data-pdf="img/Python for Data Science.pdf">
    <div class="thumb">
      <iframe src="img/Python for Data Science.pdf#view=FitH"></iframe>
    </div>
  </article>

  <article class="card" data-pdf="img/ArcGIS.pdf">
    <div class="thumb">
      <iframe src="img/ArcGIS.pdf#view=FitH"></iframe>
    </div>
  </article>
</div>
<script></script>
</body>
</html>
